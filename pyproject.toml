[build-system]
requires = [
    "setuptools>=70.0.0",
    "numpy>=1.26.4,<2.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "kitconc"
version = "3.5.1"
description = "A toolkit for Corpus Linguistics Analysis"
readme = {file = "README.txt", content-type = "text/x-rst"}
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "José Lopes Moreira Filho", email = "jlopes@alumni.usp.br"},
]
dependencies = [
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "xlsxwriter>=3.2.3,<4.0.0",
    "ttkbootstrap>=1.12.0,<2.0.0",
    "pillow>=12.3.0,<13.0.0",
    "requests>=2.31.0,<3.0.0",
    "chardet>=5.2.0,<6.0.0",
    "pypdf>=4.0.0,<7.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
full = [
    "torch>=2.6,<2.14",
    "transformers>=4.45,<6.0.0",
    "sentence-transformers>=3.0,<6.0.0",
    "sqlite-vec>=0.1.7,<1.0.0",
    "fastapi>=0.110,<1.0.0",
    "uvicorn[standard]>=0.27,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
kitconc-app = "kitconc.cli_app:main"
kitconc-mcp = "kitconc.agent.mcp_server:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
kitconc = ["data/*.*", "data/images/*.*", "data/scripts/*.*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
